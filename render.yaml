services:
  # ── Python FastAPI ML Prediction Service ──
  - type: web
    name: quickshield-ml
    env: python
    rootDir: ml_service
    plan: free # Change to starter/standard for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
    healthCheckPath: /health

  # ── Node.js Express Main Backend API ──
  - type: web
    name: quickshield-backend
    env: node
    # Since your Local terminal has QuickShield-Backend open, it couldn't be renamed to 'backend'.
    # You can rename the folder to backend/ later and update this rootDir value.
    rootDir: QuickShield-Backend 
    plan: free # Change to starter/standard for production
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: quickshield-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_ENV
        value: production
      # These credentials should be added manually in the Render Dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
